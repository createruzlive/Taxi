name: Chaqiruv.exe yasash

# .exe faylni avtomatik yasaydi (Windows kompyuter kerak emas).
# Ishga tushirish:
#   1. GitHub'да repozitoriya sahifasi -> "Actions" bo'limi
#   2. Chapdan "Chaqiruv.exe yasash" -> "Run workflow"
#   3. Tugagach, "Artifacts" ostidan "Chaqiruv-exe" ni yuklab oling.
# Har push'да ham avtomatik yasaladi.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/direktor-anvar-call-system-xk4pca
    paths:
      - "chaqiruv.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller o'rnatish
        run: python -m pip install --upgrade pyinstaller

      - name: Chaqiruv.exe yasash
        run: python -m PyInstaller --onefile --windowed --name Chaqiruv --clean chaqiruv.py

      - name: .exe faylni saqlash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Chaqiruv-exe
          path: dist/Chaqiruv.exe
